<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Criaki</title>
    <meta name="description" content="Seu estúdio de criação — ideias, roteiros, gravação e biblioteca no seu ritmo." />

    <!-- Theme -->
    <meta name="theme-color" content="#0C0C0C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F5F3" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA / iOS home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Criaki" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Icons (desktop favicon = logo pro app; PWA icons = logo criaki claro) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Criaki" />
    <meta property="og:description" content="Seu estúdio de criação — ideias, roteiros, gravação e biblioteca no seu ritmo." />
    <meta property="og:image" content="/pwa-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('vite:preloadError', function (event) {
        event.preventDefault();
        var key = 'criaki-chunk-reload';
        try {
          if (sessionStorage.getItem(key) === '1') return;
          sessionStorage.setItem(key, '1');
        } catch (e) {}
        var done = function () { window.location.reload(); };
        if (!window.caches) {
          done();
          return;
        }
        window.caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (name) { return window.caches.delete(name); }));
        }).then(function () {
          if (!navigator.serviceWorker) return;
          return navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
          });
        }).finally(done);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
